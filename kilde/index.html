
  <!DOCTYPE html>
  <html lang="NO">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>NMBU-sammenligning</title>
      <meta name="description" content="Sammenligning av opptak, karakterer og studiekvalitet for NMBUs fakulteter mot konkurrerende studieprogram. Kilder: Samordna opptak, DBH/HKDIR og Studiebarometeret." />
      <meta property="og:title" content="NMBU-sammenligning" />
      <meta property="og:description" content="Opptak, karakterer og studiekvalitet for NMBUs fakulteter, sammenlignet med konkurrerende studieprogram." />
      <meta property="og:type" content="website" />
      <meta property="og:locale" content="nb_NO" />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    <script>
      // Lys/mørk før første tegning: lagret valg, ellers systeminnstillingen (se ThemeToggle.tsx)
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') document.documentElement.classList.add('dark');
          // Fargetema (se fargetemaStore.ts): NMBU er standard og har ingen attributt
          var f = new URLSearchParams(location.search).get('farge') || localStorage.getItem('fargetema');
          if (f === 'vac' || f === 'fjord' || f === 'lyng') document.documentElement.setAttribute('data-farge', f);
        } catch (e) {}
      })();
    </script>
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
